<!doctype html><html lang="zh-TW"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI協作｜W14</title><style>body{margin:0;background:#faf7ee;color:#183b4c;font:21px/1.8 system-ui,sans-serif}main{max-width:920px;padding:35px 24px;margin:auto}h1{font-size:36px;line-height:1.4}h2{font-size:26px;color:#176b63}textarea{box-sizing:border-box;width:100%;min-height:240px;font:20px/1.7 system-ui;border:2px solid #176b63;padding:20px;color:#183b4c;background:#fffef9}button,a{font:inherit;color:#176b63}button{padding:10px 18px;cursor:pointer}.step{border-top:2px solid #bbcdc0;padding-top:16px}.note{background:#e8f0e9;padding:18px}</style><main><p>W14 · 原有工作時間內自選使用</p><h1>自己的初稿完成後，比較另一種安排</h1><h2>先由我決定</h2><p>先完成自己的關鍵頁，保留原版；沒有AI就用教師候選。</p><h2 class="step">再請AI協助</h2><p>把空格換成自己的問題與材料，只提供本次需要的公共內容。</p><textarea aria-label="AI協作提示詞" readonly>讀者是＿＿，我想說的關係是＿＿。這是我的初稿＿＿，原文與不可省略的條件＿＿。請提出一種不同的頁面安排，說明它想幫讀者看見什麼；不得增添成效或因果。請標出可能改變原意的地方，讓我回查。</textarea><button id="copy">複製提示詞</button><span id="status" role="status"></span><h2 class="step">最後我核對、我決定</h2><p>比較候選如何幫助理解，回原文查有沒有多說或漏掉；採用、部分採用或不用都要本人決定。</p><p class="note">有使用才在作品牆既有來源／入口欄簡記：「AI幫忙＿＿；我回＿＿核對；最後採用／改成／不用＿＿。」不用貼完整對話，不另交一份作業。不使用AI也可以完成。</p><p><a href="../../index.html">回本週簡報</a></p></main><script>document.querySelector('#copy').onclick=async()=>{const t=document.querySelector('textarea');try{await navigator.clipboard.writeText(t.value);document.querySelector('#status').textContent=' 已複製';}catch(e){t.focus();t.select();document.querySelector('#status').textContent=' 請複製已選取文字';}};</script></html>
