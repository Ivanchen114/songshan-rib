<svg xmlns="http://www.w3.org/2000/svg" aria-label="教師線圖：甲強調一組搭配，乙強調兩類選擇" role="img" viewBox="0 0 1300 420"><g fill="black" font-family="sans-serif" stroke="none" text-anchor="middle"><text font-size="32" x="310" y="40">甲｜突出一組搭配</text><text font-size="32" x="970" y="40">乙｜突出選擇結構</text><rect fill="white" height="245" stroke="black" stroke-width="3" width="460" x="80" y="80"></rect><path d="M155 200 Q215 120 275 200 M155 215 H275 M155 235 H275 M330 150 H405 L391 255 H344 Z" fill="none" stroke="black" stroke-width="7"></path><text font-size="30" x="215" y="285">一款食物</text><text font-size="30" x="370" y="285">一款飲料</text><text font-size="29" x="310" y="365">這組是示例？還有別的選擇？</text><rect fill="white" height="245" stroke="black" stroke-width="3" width="220" x="690" y="80"></rect><rect fill="white" height="245" stroke="black" stroke-width="3" width="220" x="1030" y="80"></rect><text font-size="30" x="800" y="132">食物選項</text><text font-size="28" x="800" y="185">甲　乙</text><text font-size="28" x="800" y="235">丙　丁　戊</text><text font-size="30" x="1140" y="132">飲料選項</text><text font-size="28" x="1140" y="200">一　二　三</text><text font-size="60" x="970" y="220">＋</text><text font-size="29" x="970" y="365">兩類各選一個，形成搭配</text></g></svg>