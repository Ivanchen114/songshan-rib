<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 800"><rect width="1100" height="800" fill="#f5f2e8"/><text x="65" y="80" font-size="38" fill="#234e44" font-family="sans-serif">公共說明：讓讀者找得到五件事</text><rect x="65" y="115" width="970" height="105" rx="12" fill="white" stroke="#91ada1"/><text x="88" y="158" font-size="30" fill="#234e44" font-family="sans-serif">01　比較問題</text><text x="160" y="197" font-size="27" fill="#526b63" font-family="sans-serif">兩種做法，用相同的項目比較</text><rect x="65" y="240" width="970" height="105" rx="12" fill="white" stroke="#91ada1"/><text x="88" y="283" font-size="30" fill="#234e44" font-family="sans-serif">02　目前判斷</text><text x="160" y="322" font-size="27" fill="#526b63" font-family="sans-serif">目前傾向什麼；另一方哪裡有道理</text><rect x="65" y="365" width="970" height="105" rx="12" fill="white" stroke="#91ada1"/><text x="88" y="408" font-size="30" fill="#234e44" font-family="sans-serif">03　資料根據</text><text x="160" y="447" font-size="27" fill="#526b63" font-family="sans-serif">指出來源，說清楚支持到哪裡</text><rect x="65" y="490" width="970" height="105" rx="12" fill="white" stroke="#91ada1"/><text x="88" y="533" font-size="30" fill="#234e44" font-family="sans-serif">04　限制</text><text x="160" y="572" font-size="27" fill="#526b63" font-family="sans-serif">目前還不知道什麼；不能推到哪裡</text><rect x="65" y="615" width="970" height="105" rx="12" fill="white" stroke="#91ada1"/><text x="88" y="658" font-size="30" fill="#234e44" font-family="sans-serif">05　繼續／停止條件</text><text x="160" y="697" font-size="27" fill="#526b63" font-family="sans-serif">看到什麼才繼續；什麼情況應停止</text></svg>