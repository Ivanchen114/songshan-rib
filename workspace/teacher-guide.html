<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>每週操作速查｜閱讀理解與表達</title><link rel="stylesheet" href="workspace.css"></head><body><header><a href="/workspace/">← 回作品工作區</a><a href="/workspace/guide.html">看操作示範</a></header><main><div class="intro"><p class="eyebrow">教師隨手查</p><h1>不用記住所有按鈕。</h1><p>電腦上把滑鼠移到平台按鈕，就會出現用途說明。手機可展開「本週操作說明」，或在這裡搜尋。這頁只提供說明，不會更改課堂設定或學生紀錄。</p></div><section class="panel"><div class="work-filters"><label>查看哪個活動<select id="helpWeek"><option value="all">所有現行活動</option></select></label><label>搜尋按鈕或用途<input id="helpSearch" type="search" placeholder="例如：補交、忘記六碼、ORID、抽題"></label></div><p class="muted">只列平台已有的操作入口；沒有列出的週次不代表要新增線上交件。按鈕會依角色、課堂階段與交件狀態出現。</p><p id="helpCount" role="status"></p></section><div id="helpResults"></div></main><script type="module" src="teacher-guide.js"></script></body></html>
